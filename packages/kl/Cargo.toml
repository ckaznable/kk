[package]
name = "kl"
version = "0.1.0"
edition = "2021"

[features]
default = ["browser"]
browser = ["dep:playwright"]

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
reqwest = { workspace = true, features = ["cookies"] }
scraper = "0.22"
quick-xml = { version = "0.38.4", features = ["serialize"] }
kr = { path = "../kr" }
kwa = { path = "../kwa" }
clap = { version = "4.5", features = ["derive"] }
regex = "1.10"
walkdir = "2.5"
dirs = { workspace = true }
tokio = { version = "1", features = ["full"] }
playwright = { version = "0.0.20", optional = true }
async-recursion = "1.1"
async-trait = "0.1"
futures-util = "0.3"
percent-encoding = "2.3"
